name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Package when this version is not released
        id: package
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./manifest.json').version")"
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "${TAG} already exists. CI passed; no new release."
            exit 0
          fi
          echo "exists=false" >> "$GITHUB_OUTPUT"
          npm run package
          shasum -a 256 "kana-helper-${TAG}.zip" | tee checksum.txt
      - name: Publish GitHub Release
        if: steps.package.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.package.outputs.tag }}"
          gh release create "$TAG" "kana-helper-${TAG}.zip" checksum.txt \
            --target "${{ github.event.workflow_run.head_sha }}" \
            --title "Kana Helper ${TAG}" \
            --notes "Packaged extension for ${TAG}. The zip root is the extension. Readings stay on the device. See PRIVACY.md."
